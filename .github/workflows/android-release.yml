name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch the release signing config
        run: node scripts/patch-android-signing.js android/app/build.gradle

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Resolve the release name
        id: release_name
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APK
        working-directory: android
        env:
          HYDRA_UPLOAD_STORE_FILE: release.keystore
          HYDRA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HYDRA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HYDRA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PHYDRA_UPLOAD_STORE_FILE="$HYDRA_UPLOAD_STORE_FILE" \
            -PHYDRA_UPLOAD_KEY_ALIAS="$HYDRA_UPLOAD_KEY_ALIAS" \
            -PHYDRA_UPLOAD_STORE_PASSWORD="$HYDRA_UPLOAD_STORE_PASSWORD" \
            -PHYDRA_UPLOAD_KEY_PASSWORD="$HYDRA_UPLOAD_KEY_PASSWORD"

      - name: Rename the APK
        id: apk
        env:
          RELEASE_NAME: ${{ steps.release_name.outputs.name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/hydra-foss-${RELEASE_NAME}.apk"
          echo "path=dist/hydra-foss-${RELEASE_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-foss-${{ steps.release_name.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
